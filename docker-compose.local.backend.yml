services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.prod
    container_name: boostad-backend-local
    command: node dist/main.js
    ports:
      - '3000:3000'
    environment:
      PORT: '3000'
      NODE_ENV: ${NODE_ENV:-development}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      CLIENT_URL: ${CLIENT_URL:-https://localhost:5173}
      DB_HOST: mysql
      DB_PORT: '3306'
      DB_USERNAME: ${DB_USERNAME:-test_user}
      DB_PASSWORD: ${DB_PASSWORD:-test_user}
      DB_DATABASE: ${DB_DATABASE:-test_db}
      REDIS_HOST: search-redis
      REDIS_PORT: '6379'
      REDIS_TOPOLOGY_MODE: ${REDIS_TOPOLOGY_MODE:-split}
      SEARCH_REDIS_URL: ${SEARCH_REDIS_URL:-redis://search-redis:6379}
      BUDGET_REDIS_URL: ${BUDGET_REDIS_URL:-redis://budget-redis:6379}
      QUEUE_REDIS_URL: ${QUEUE_REDIS_URL:-redis://queue-redis:6379}
      CAMPAIGN_PROJECTION_MODE: ${CAMPAIGN_PROJECTION_MODE:-active}
      SEARCH_PROJECTION_STREAM_MAXLEN: ${SEARCH_PROJECTION_STREAM_MAXLEN:-100000}
      JWT_SECRET: ${JWT_SECRET:-local-dev-jwt-secret}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      NCP_ACCESS_KEY: ${NCP_ACCESS_KEY:-}
      NCP_SECRET_KEY: ${NCP_SECRET_KEY:-}
      NCP_REGION: ${NCP_REGION:-kr-standard}
      NCP_ENDPOINT: ${NCP_ENDPOINT:-https://kr.object.ncloudstorage.com}
      NCP_BUCKET: ${NCP_BUCKET:-boostadad-campaign-images}
      TOSS_SECRET_KEY: ${TOSS_SECRET_KEY:-}
      RTB_ENABLE_ALL_LOGS: ${RTB_ENABLE_ALL_LOGS:-false}
      LOADTEST_RESET_ENABLED: ${LOADTEST_RESET_ENABLED:-true}
      LOADTEST_RESET_TOKEN: ${LOADTEST_RESET_TOKEN:-boostad-loadtest-reset-local}
      RTB_MATCHER_ANN_TOP_L: ${RTB_MATCHER_ANN_TOP_L:-64}
      RTB_MATCHER_ANN_TOP_M: ${RTB_MATCHER_ANN_TOP_M:-20}
      RTB_EMBEDDING_PROFILE: ${RTB_EMBEDDING_PROFILE:-multilingual_e5_small}
      RTB_EMBEDDING_QUEUE_NAME: ${RTB_EMBEDDING_QUEUE_NAME:-}
      RTB_MATCHER_DOCUMENT_SIMILARITY_THRESHOLD: ${RTB_MATCHER_DOCUMENT_SIMILARITY_THRESHOLD:-0.3}
      RTB_RETRIEVAL_MODE: ${RTB_RETRIEVAL_MODE:-dense_only}
      RTB_HYBRID_SPARSE_WEIGHT: ${RTB_HYBRID_SPARSE_WEIGHT:-0.2}
      RTB_HYBRID_SPARSE_SUPPLEMENT_LIMIT: ${RTB_HYBRID_SPARSE_SUPPLEMENT_LIMIT:-10}
      RTB_HYBRID_FINAL_LIMIT: ${RTB_HYBRID_FINAL_LIMIT:-10}
      RTB_CAMPAIGN_SOURCE: ${RTB_CAMPAIGN_SOURCE:-local_snapshot}
      RTB_BUDGET_MODE: ${RTB_BUDGET_MODE:-winner_only}
      RTB_AUCTION_RESERVATION_TTL_MS: ${RTB_AUCTION_RESERVATION_TTL_MS:-900000}
      RTB_AUCTION_TERMINAL_TTL_SECONDS: ${RTB_AUCTION_TERMINAL_TTL_SECONDS:-1800}
      RTB_EMBEDDING_L2_ENABLED: ${RTB_EMBEDDING_L2_ENABLED:-true}
      RTB_EMBEDDING_L2_LOOKUP_BUDGET_MS: ${RTB_EMBEDDING_L2_LOOKUP_BUDGET_MS:-5}
      RTB_EMBEDDING_L2_WRITE_BUDGET_MS: ${RTB_EMBEDDING_L2_WRITE_BUDGET_MS:-5}
      RTB_EMBEDDING_L2_TTL_SECONDS: ${RTB_EMBEDDING_L2_TTL_SECONDS:-604800}
      RTB_EMBEDDING_L1_MAX_SIZE: ${RTB_EMBEDDING_L1_MAX_SIZE:-1000}
      RTB_EMBEDDING_COLD_MISS_FAST_PATH_ENABLED: ${RTB_EMBEDDING_COLD_MISS_FAST_PATH_ENABLED:-true}
      RTB_LEXICAL_TOP_M: ${RTB_LEXICAL_TOP_M:-30}
      RTB_EMBEDDING_BACKGROUND_MAX_CONCURRENCY: ${RTB_EMBEDDING_BACKGROUND_MAX_CONCURRENCY:-1}
      RTB_EMBEDDING_BACKGROUND_MAX_QUEUE_SIZE: ${RTB_EMBEDDING_BACKGROUND_MAX_QUEUE_SIZE:-100}
      RTB_CONTEXT_MAX_BODY_CHARS: ${RTB_CONTEXT_MAX_BODY_CHARS:-8000}
      RTB_CONTEXT_READY_TTL_SECONDS: ${RTB_CONTEXT_READY_TTL_SECONDS:-604800}
      RTB_CONTEXT_PENDING_TTL_SECONDS: ${RTB_CONTEXT_PENDING_TTL_SECONDS:-600}
      RTB_CONTEXT_LOOKUP_BUDGET_MS: ${RTB_CONTEXT_LOOKUP_BUDGET_MS:-5}
      RTB_CONTEXT_DECISION_ENABLED: ${RTB_CONTEXT_DECISION_ENABLED:-true}
      RTB_CONTEXT_L1_MAX_SIZE: ${RTB_CONTEXT_L1_MAX_SIZE:-1000}
      RTB_CONTEXT_L1_TTL_MS: ${RTB_CONTEXT_L1_TTL_MS:-300000}

    depends_on:
      - mysql
      - search-redis
      - budget-redis
      - queue-redis
    networks:
      - boostad-local
    restart: unless-stopped
    cpus: ${BACKEND_CPUS:-2.0}
    mem_limit: ${BACKEND_MEM_LIMIT:-4g}
    pids_limit: ${BACKEND_PIDS_LIMIT:-256}

  embedding-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile.prod
    command: node dist/embedding-worker.main.js
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      REDIS_HOST: search-redis
      REDIS_PORT: '6379'
      REDIS_TOPOLOGY_MODE: ${REDIS_TOPOLOGY_MODE:-split}
      SEARCH_REDIS_URL: ${SEARCH_REDIS_URL:-redis://search-redis:6379}
      BUDGET_REDIS_URL: ${BUDGET_REDIS_URL:-redis://budget-redis:6379}
      QUEUE_REDIS_URL: ${QUEUE_REDIS_URL:-redis://queue-redis:6379}
      CAMPAIGN_PROJECTION_MODE: ${CAMPAIGN_PROJECTION_MODE:-active}
      RTB_EMBEDDING_PROFILE: ${RTB_EMBEDDING_PROFILE:-multilingual_e5_small}
      RTB_EMBEDDING_QUEUE_NAME: ${RTB_EMBEDDING_QUEUE_NAME:-}
      RTB_CONTEXT_MAX_BODY_CHARS: ${RTB_CONTEXT_MAX_BODY_CHARS:-8000}
      RTB_CONTEXT_READY_TTL_SECONDS: ${RTB_CONTEXT_READY_TTL_SECONDS:-604800}
      RTB_CONTEXT_PENDING_TTL_SECONDS: ${RTB_CONTEXT_PENDING_TTL_SECONDS:-600}
    depends_on:
      - search-redis
      - queue-redis
    networks:
      - boostad-local
    restart: unless-stopped
    cpus: ${EMBEDDING_WORKER_CPUS:-2.0}
    mem_limit: ${EMBEDDING_WORKER_MEM_LIMIT:-4g}
    pids_limit: ${EMBEDDING_WORKER_PIDS_LIMIT:-256}

  reservation-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile.prod
    command: node dist/reservation-worker.main.js
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      REDIS_HOST: search-redis
      REDIS_PORT: '6379'
      REDIS_TOPOLOGY_MODE: ${REDIS_TOPOLOGY_MODE:-split}
      SEARCH_REDIS_URL: ${SEARCH_REDIS_URL:-redis://search-redis:6379}
      BUDGET_REDIS_URL: ${BUDGET_REDIS_URL:-redis://budget-redis:6379}
      QUEUE_REDIS_URL: ${QUEUE_REDIS_URL:-redis://queue-redis:6379}
      RTB_AUCTION_TERMINAL_TTL_SECONDS: ${RTB_AUCTION_TERMINAL_TTL_SECONDS:-1800}
      RTB_RESERVATION_SWEEP_INTERVAL_MS: ${RTB_RESERVATION_SWEEP_INTERVAL_MS:-1000}
      RTB_RESERVATION_SWEEP_BATCH_SIZE: ${RTB_RESERVATION_SWEEP_BATCH_SIZE:-100}
      RTB_RESERVATION_SWEEP_TIME_BUDGET_MS: ${RTB_RESERVATION_SWEEP_TIME_BUDGET_MS:-200}
      RTB_RESERVATION_SWEEP_MAX_BATCHES: ${RTB_RESERVATION_SWEEP_MAX_BATCHES:-10}
    depends_on:
      - budget-redis
    networks:
      - boostad-local
    restart: unless-stopped
    cpus: ${RESERVATION_WORKER_CPUS:-0.5}
    mem_limit: ${RESERVATION_WORKER_MEM_LIMIT:-512m}
    pids_limit: ${RESERVATION_WORKER_PIDS_LIMIT:-128}

  projection-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile.prod
    command: node dist/campaign-projection-worker.main.js
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DB_HOST: mysql
      DB_PORT: '3306'
      DB_USERNAME: ${DB_USERNAME:-test_user}
      DB_PASSWORD: ${DB_PASSWORD:-test_user}
      DB_DATABASE: ${DB_DATABASE:-test_db}
      REDIS_TOPOLOGY_MODE: split
      SEARCH_REDIS_URL: ${SEARCH_REDIS_URL:-redis://search-redis:6379}
      BUDGET_REDIS_URL: ${BUDGET_REDIS_URL:-redis://budget-redis:6379}
      QUEUE_REDIS_URL: ${QUEUE_REDIS_URL:-redis://queue-redis:6379}
      CAMPAIGN_PROJECTION_MODE: ${CAMPAIGN_PROJECTION_MODE:-active}
      SEARCH_PROJECTION_STREAM_MAXLEN: ${SEARCH_PROJECTION_STREAM_MAXLEN:-100000}
      PROJECTION_WORKER_CONCURRENCY: ${PROJECTION_WORKER_CONCURRENCY:-8}
      PROJECTION_WORKER_POLL_MS: ${PROJECTION_WORKER_POLL_MS:-100}
      PROJECTION_WORKER_LEASE_MS: ${PROJECTION_WORKER_LEASE_MS:-30000}
      PROJECTION_WORKER_MAX_ATTEMPTS: ${PROJECTION_WORKER_MAX_ATTEMPTS:-20}
      RTB_EMBEDDING_PROFILE: ${RTB_EMBEDDING_PROFILE:-multilingual_e5_small}
      RTB_EMBEDDING_QUEUE_NAME: ${RTB_EMBEDDING_QUEUE_NAME:-}
    depends_on:
      - mysql
      - search-redis
      - budget-redis
      - queue-redis
    networks:
      - boostad-local
    restart: unless-stopped
    cpus: ${PROJECTION_WORKER_CPUS:-1.0}
    mem_limit: ${PROJECTION_WORKER_MEM_LIMIT:-1g}
    pids_limit: ${PROJECTION_WORKER_PIDS_LIMIT:-128}
