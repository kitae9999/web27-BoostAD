services:
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile.local
    container_name: boostad-nginx-local
    ports:
      - '80:80'
      - '443:443'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    restart: unless-stopped
    networks:
      - boostad-local

  search-redis:
    image: redis/redis-stack-server:latest
    container_name: boostad-search-redis-local
    ports:
      - '16379:6379'
    environment:
      - REDIS_ARGS=--protected-mode no --maxmemory 2gb --maxmemory-policy volatile-lfu --save 900 1 --save 300 10 --save 60 10000
    volumes:
      - search-redis-data:/data
    restart: unless-stopped
    networks:
      - boostad-local

  budget-redis:
    image: redis:7.4-alpine
    container_name: boostad-budget-redis-local
    ports:
      - '16380:6379'
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --appendfsync
      - everysec
      - --maxmemory
      - 1gb
      - --maxmemory-policy
      - noeviction
    volumes:
      - budget-redis-data:/data
    restart: unless-stopped
    networks:
      - boostad-local

  queue-redis:
    image: redis:7.4-alpine
    container_name: boostad-queue-redis-local
    ports:
      - '16381:6379'
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --appendfsync
      - everysec
      - --maxmemory
      - 1gb
      - --maxmemory-policy
      - noeviction
    volumes:
      - queue-redis-data:/data
    restart: unless-stopped
    networks:
      - boostad-local

  mysql:
    image: mysql:8.0
    container_name: boostad-mysql-local
    ports:
      - '13306:3306' # 호스트 13306 -> 컨테이너 3306
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-test_user}
      MYSQL_DATABASE: ${DB_DATABASE:-test_db}
      MYSQL_USER: ${DB_USERNAME:-test_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-test_user}
      TZ: Asia/Seoul
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro # 초기화 스크립트 -> 파일 순서대로 실행
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+09:00
    restart: unless-stopped
    networks:
      - boostad-local

volumes:
  search-redis-data:
  budget-redis-data:
  queue-redis-data:
  mysql-data:

networks:
  boostad-local:
    driver: bridge
