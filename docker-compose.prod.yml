services:
  nginx:
    image: ${NCR_ENDPOINT:-local}/boostad/nginx:${IMAGE_TAG:-deploy}
    ports:
      - '80:80'
    expose:
      - '8080'
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    image: ${NCR_ENDPOINT:-local}/boostad/backend:${IMAGE_TAG:-deploy}
    environment:
      PORT: '3000'
      # 배포 시 Object Storage(정적 호스팅) 도메인으로 교체
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3000}
      NODE_ENV: ${NODE_ENV:-development}
      DB_HOST: ${DB_HOST:-localhost}
      DB_PORT: ${DB_PORT:-3306}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      # NCP Object Storage (image upload)
      NCP_ACCESS_KEY: ${NCP_ACCESS_KEY:-}
      NCP_SECRET_KEY: ${NCP_SECRET_KEY:-}
      NCP_REGION: ${NCP_REGION:-kr-standard}
      NCP_ENDPOINT: ${NCP_ENDPOINT:-https://kr.object.ncloudstorage.com}
      NCP_BUCKET: ${NCP_BUCKET:-boostadad-campaign-images}
      REDIS_HOST: ${REDIS_HOST:-localhost}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_TOPOLOGY_MODE: ${REDIS_TOPOLOGY_MODE:-legacy}
      SEARCH_REDIS_URL: ${SEARCH_REDIS_URL:-redis://localhost:6379}
      BUDGET_REDIS_URL: ${BUDGET_REDIS_URL:-redis://localhost:6379}
      QUEUE_REDIS_URL: ${QUEUE_REDIS_URL:-redis://localhost:6379}
      CAMPAIGN_PROJECTION_MODE: ${CAMPAIGN_PROJECTION_MODE:-off}
      SEARCH_PROJECTION_STREAM_MAXLEN: ${SEARCH_PROJECTION_STREAM_MAXLEN:-100000}
      TOSS_SECRET_KEY: ${TOSS_SECRET_KEY}
      RTB_ENABLE_ALL_LOGS: ${RTB_ENABLE_ALL_LOGS:-false}
      RTB_EMBEDDING_PROFILE: ${RTB_EMBEDDING_PROFILE:-multilingual_e5_small}
      RTB_EMBEDDING_QUEUE_NAME: ${RTB_EMBEDDING_QUEUE_NAME:-}
      RTB_DENSE_RETRIEVAL_MODE: ${RTB_DENSE_RETRIEVAL_MODE:-semantic_document}
      RTB_MATCHER_DOCUMENT_SIMILARITY_THRESHOLD: ${RTB_MATCHER_DOCUMENT_SIMILARITY_THRESHOLD:-0.3}
      RTB_CAMPAIGN_SOURCE: ${RTB_CAMPAIGN_SOURCE:-redis_json}
      LOADTEST_RESET_ENABLED: ${LOADTEST_RESET_ENABLED:-false}
      LOADTEST_RESET_TOKEN: ${LOADTEST_RESET_TOKEN:-}
      RTB_BUDGET_MODE: ${RTB_BUDGET_MODE:-legacy_topk}
      RTB_AUCTION_RESERVATION_TTL_MS: ${RTB_AUCTION_RESERVATION_TTL_MS:-900000}
      RTB_AUCTION_TERMINAL_TTL_SECONDS: ${RTB_AUCTION_TERMINAL_TTL_SECONDS:-1800}
      RTB_CONTEXT_MAX_BODY_CHARS: ${RTB_CONTEXT_MAX_BODY_CHARS:-8000}
      RTB_CONTEXT_READY_TTL_SECONDS: ${RTB_CONTEXT_READY_TTL_SECONDS:-604800}
      RTB_CONTEXT_PENDING_TTL_SECONDS: ${RTB_CONTEXT_PENDING_TTL_SECONDS:-600}
      RTB_CONTEXT_LOOKUP_BUDGET_MS: ${RTB_CONTEXT_LOOKUP_BUDGET_MS:-5}
      RTB_CONTEXT_DECISION_ENABLED: ${RTB_CONTEXT_DECISION_ENABLED:-false}
      RTB_CONTEXT_L1_MAX_SIZE: ${RTB_CONTEXT_L1_MAX_SIZE:-1000}
      RTB_CONTEXT_L1_TTL_MS: ${RTB_CONTEXT_L1_TTL_MS:-300000}
    expose:
      - '3000'
    restart: unless-stopped

  embedding-worker:
    image: ${NCR_ENDPOINT:-local}/boostad/backend:${IMAGE_TAG:-deploy}
    command: ['node', 'dist/embedding-worker.main.js']
    environment:
      # HTTP 서버 없이 embedding queue만 소비합니다.
      NODE_ENV: ${NODE_ENV:-development}
      REDIS_HOST: ${REDIS_HOST:-localhost}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_TOPOLOGY_MODE: ${REDIS_TOPOLOGY_MODE:-legacy}
      SEARCH_REDIS_URL: ${SEARCH_REDIS_URL:-redis://localhost:6379}
      BUDGET_REDIS_URL: ${BUDGET_REDIS_URL:-redis://localhost:6379}
      QUEUE_REDIS_URL: ${QUEUE_REDIS_URL:-redis://localhost:6379}
      CAMPAIGN_PROJECTION_MODE: ${CAMPAIGN_PROJECTION_MODE:-off}
      RTB_EMBEDDING_PROFILE: ${RTB_EMBEDDING_PROFILE:-multilingual_e5_small}
      RTB_EMBEDDING_QUEUE_NAME: ${RTB_EMBEDDING_QUEUE_NAME:-}
      RTB_DENSE_RETRIEVAL_MODE: ${RTB_DENSE_RETRIEVAL_MODE:-semantic_document}
      RTB_CONTEXT_MAX_BODY_CHARS: ${RTB_CONTEXT_MAX_BODY_CHARS:-8000}
      RTB_CONTEXT_READY_TTL_SECONDS: ${RTB_CONTEXT_READY_TTL_SECONDS:-604800}
      RTB_CONTEXT_PENDING_TTL_SECONDS: ${RTB_CONTEXT_PENDING_TTL_SECONDS:-600}
    restart: unless-stopped

  # legacy/off 상태에서 split projection을 shadow 구축할 때만 함께 실행한다.
  # 기존 embedding-worker는 legacy Queue를 계속 소비하고, 이 worker는
  # Projection Worker가 split Queue에 넣은 versioned job을 소비한다.
  projection-embedding-worker:
    profiles: ['projection-shadow']
    image: ${NCR_ENDPOINT:-local}/boostad/backend:${IMAGE_TAG:-deploy}
    command: ['node', 'dist/embedding-worker.main.js']
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      REDIS_HOST: ${REDIS_HOST:-localhost}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_TOPOLOGY_MODE: split
      SEARCH_REDIS_URL: ${SEARCH_REDIS_URL:-redis://localhost:6379}
      BUDGET_REDIS_URL: ${BUDGET_REDIS_URL:-redis://localhost:6379}
      QUEUE_REDIS_URL: ${QUEUE_REDIS_URL:-redis://localhost:6379}
      CAMPAIGN_PROJECTION_MODE: shadow
      RTB_EMBEDDING_PROFILE: ${RTB_EMBEDDING_PROFILE:-multilingual_e5_small}
      RTB_EMBEDDING_QUEUE_NAME: ${RTB_EMBEDDING_QUEUE_NAME:-}
      RTB_DENSE_RETRIEVAL_MODE: ${RTB_DENSE_RETRIEVAL_MODE:-semantic_document}
      RTB_CONTEXT_MAX_BODY_CHARS: ${RTB_CONTEXT_MAX_BODY_CHARS:-8000}
      RTB_CONTEXT_READY_TTL_SECONDS: ${RTB_CONTEXT_READY_TTL_SECONDS:-604800}
      RTB_CONTEXT_PENDING_TTL_SECONDS: ${RTB_CONTEXT_PENDING_TTL_SECONDS:-600}
    restart: unless-stopped

  reservation-worker:
    image: ${NCR_ENDPOINT:-local}/boostad/backend:${IMAGE_TAG:-deploy}
    command: ['node', 'dist/reservation-worker.main.js']
    environment:
      # HTTP 서버와 E5 모델 없이 reservation expiration만 회수합니다.
      NODE_ENV: ${NODE_ENV:-development}
      REDIS_HOST: ${REDIS_HOST:-localhost}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_TOPOLOGY_MODE: ${REDIS_TOPOLOGY_MODE:-legacy}
      SEARCH_REDIS_URL: ${SEARCH_REDIS_URL:-redis://localhost:6379}
      BUDGET_REDIS_URL: ${BUDGET_REDIS_URL:-redis://localhost:6379}
      QUEUE_REDIS_URL: ${QUEUE_REDIS_URL:-redis://localhost:6379}
      RTB_AUCTION_TERMINAL_TTL_SECONDS: ${RTB_AUCTION_TERMINAL_TTL_SECONDS:-1800}
      RTB_RESERVATION_SWEEP_INTERVAL_MS: ${RTB_RESERVATION_SWEEP_INTERVAL_MS:-1000}
      RTB_RESERVATION_SWEEP_BATCH_SIZE: ${RTB_RESERVATION_SWEEP_BATCH_SIZE:-100}
      RTB_RESERVATION_SWEEP_TIME_BUDGET_MS: ${RTB_RESERVATION_SWEEP_TIME_BUDGET_MS:-200}
      RTB_RESERVATION_SWEEP_MAX_BATCHES: ${RTB_RESERVATION_SWEEP_MAX_BATCHES:-10}
    restart: unless-stopped

  projection-worker:
    image: ${NCR_ENDPOINT:-local}/boostad/backend:${IMAGE_TAG:-deploy}
    command: ['node', 'dist/campaign-projection-worker.main.js']
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DB_HOST: ${DB_HOST:-localhost}
      DB_PORT: ${DB_PORT:-3306}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}
      REDIS_HOST: ${REDIS_HOST:-localhost}
      REDIS_PORT: ${REDIS_PORT:-6379}
      # API가 legacy serving 중이어도 shadow projection은 split endpoint에 쓴다.
      REDIS_TOPOLOGY_MODE: split
      SEARCH_REDIS_URL: ${SEARCH_REDIS_URL:-redis://localhost:6379}
      BUDGET_REDIS_URL: ${BUDGET_REDIS_URL:-redis://localhost:6379}
      QUEUE_REDIS_URL: ${QUEUE_REDIS_URL:-redis://localhost:6379}
      CAMPAIGN_PROJECTION_MODE: ${CAMPAIGN_PROJECTION_MODE:-off}
      SEARCH_PROJECTION_STREAM_MAXLEN: ${SEARCH_PROJECTION_STREAM_MAXLEN:-100000}
      PROJECTION_WORKER_CONCURRENCY: ${PROJECTION_WORKER_CONCURRENCY:-8}
      PROJECTION_WORKER_POLL_MS: ${PROJECTION_WORKER_POLL_MS:-100}
      PROJECTION_WORKER_LEASE_MS: ${PROJECTION_WORKER_LEASE_MS:-30000}
      PROJECTION_WORKER_MAX_ATTEMPTS: ${PROJECTION_WORKER_MAX_ATTEMPTS:-20}
      RTB_EMBEDDING_PROFILE: ${RTB_EMBEDDING_PROFILE:-multilingual_e5_small}
      RTB_EMBEDDING_QUEUE_NAME: ${RTB_EMBEDDING_QUEUE_NAME:-}
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.8.1
    restart: unless-stopped
    network_mode: host
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:0.11.0
    restart: unless-stopped
    depends_on:
      - nginx
    command:
      - -nginx.scrape-uri=http://nginx:8080/stub_status
    ports:
      - '9113:9113'
